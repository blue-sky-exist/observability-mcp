profiles:
  - name: generic
    index_patterns: ["*"]
    fields:
      timestamp: ["@timestamp", "timestamp", "time"]
      message: ["message", "log.message", "msg", "log.original"]
      project: ["service.name", "project", "application", "app"]
      node_ip: ["host.ip", "host.name", "beat.hostname.keyword", "beat.name.keyword", "beat.hostname", "beat.name"]
      trace_id:
        message_fallback: true
      level:
        message_fallback: true
      error:
        type: ["error.type", "error_type", "exception.type"]
        message: ["error.message", "error_message", "exception.message"]
        stack_trace: ["error.stack_trace", "error_stack_trace", "exception.stacktrace"]
      attributes:
        span_id: ["span.id", "spanId"]
        logger: ["log.logger", "log_logger"]
        thread: ["process.thread.name", "process_thread_name"]
        log_source: ["log.file.path", "source"]
    sort:
      - field: offset
        order: asc
        unmapped_type: long
