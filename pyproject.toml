[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "observability-mcp"
version = "1.0.0"
description = "Streamable HTTP MCP for Elasticsearch, SkyWalking, and Prometheus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp==2.0.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "tzdata==2026.3",
]

[project.scripts]
observability-mcp = "observability_mcp.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.1",
]

[tool.setuptools.packages.find]
include = ["observability_mcp*"]

[tool.setuptools.package-data]
observability_mcp = ["default-log-profiles.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
